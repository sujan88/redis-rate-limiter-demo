spring.config.import=optional:file:./newrelic-local.properties
# Direct Micrometer export to New Relic's dimensional Metric data type.
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${NEW_RELIC_OTLP_METRICS_URL:https://otlp.nr-data.net/v1/metrics}
management.otlp.metrics.export.headers.api-key=${NEW_RELIC_LICENSE_KEY:replace-with-your-license-key}
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.aggregation-temporality=delta
