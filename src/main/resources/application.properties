spring.application.name=redis-rate-limiter-demo
server.port=${PORT:8080}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Small study defaults; set capacity=100 and lease-size=50 for larger bursts.
rate-limit.capacity=5
rate-limit.refill-per-second=1
rate-limit.lease-size=2
rate-limit.lease-ttl=2s
rate-limit.local-fallback=false
management.endpoints.web.exposure.include=health,metrics,prometheus

# Activate the newrelic profile to push metrics; local runs need no credentials.
management.otlp.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}
